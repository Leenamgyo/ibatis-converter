<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ibatis-migration-analyzer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="schema.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>ibatis-migration-analyzer</h1>
    </div>
    <nav class="tabs" id="screenTabs" role="tablist" aria-label="화면">
      <button class="tab active" role="tab" id="screenTabAnalysis" data-screen="analysis"
              aria-selected="true" aria-controls="app">분석</button>
      <button class="tab" role="tab" id="screenTabDatasets" data-screen="datasets"
              aria-selected="false" aria-controls="datasetScreen" tabindex="-1">
        데이터셋 <span class="tab-count" id="datasetCount"></span>
      </button>
    </nav>
    <div class="top-actions">
      <button class="btn" id="folderBtn" type="button" title="프로젝트 폴더를 고르면 SQL 매퍼(iBATIS &lt;sqlMap&gt; / MyBatis &lt;mapper&gt;)만 찾아 서버로 보냅니다. 다른 파일과 target/ 같은 빌드 폴더는 읽지 않습니다">프로젝트 폴더</button>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <form class="path-open" id="pathForm" title="이 컴퓨터의 프로젝트 폴더 경로: 서버가 그 자리에서 읽습니다 (업로드 없음, localhost 전용)">
        <input type="text" id="pathInput" placeholder="/path/to/project" aria-label="로컬 프로젝트 경로" spellcheck="false">
        <button class="btn" type="submit">경로 열기</button>
      </form>
      <label class="btn">
        Upload mapper XML
        <input type="file" id="fileInput" multiple accept=".xml" hidden>
      </label>
      <button class="btn" id="sampleBtn">Load sample</button>
      <button class="btn" id="advancedBtn" title="2000줄 단일 리포트 쿼리 + 까다로운 iBATIS 2 문법">Load advanced</button>
      <button class="btn primary" id="analyzeBtn" disabled>Analyze</button>
      <span class="file-count" id="fileCount"></span>
    </div>
  </header>

  <!-- 프로젝트 폴더: folders on this machine, listed by the local server (no upload, no browser picker) -->
  <dialog class="folder-dialog" id="folderDialog" aria-labelledby="folderDialogTitle">
    <form method="dialog" class="fd-inner">
      <div class="fd-head">
        <h2 id="folderDialogTitle">프로젝트 폴더 선택</h2>
        <button class="fd-x" value="cancel" aria-label="닫기">×</button>
      </div>
      <div class="fd-path" id="folderPath"></div>
      <div class="fd-nav">
        <button type="button" class="btn small" id="folderUp">↑ 상위 폴더</button>
        <button type="button" class="btn small" id="folderHome">홈</button>
        <span class="fd-hint">폴더를 클릭해 들어가고, 프로젝트 폴더에서 “이 폴더 열기”</span>
      </div>
      <ul class="fd-list" id="folderList" role="listbox" aria-label="하위 폴더"></ul>
      <div class="fd-foot">
        <button type="button" class="btn link" id="folderBrowserPicker" title="이 컴퓨터가 아닌 곳에서 열었을 때: 브라우저의 폴더 선택기">브라우저 선택기로 고르기</button>
        <span class="fd-error" id="folderError" role="alert"></span>
        <button type="button" class="btn primary" id="folderOpen">이 폴더 열기</button>
      </div>
    </form>
  </dialog>

  <div class="update-bar" id="updateBar" role="status" hidden>
    화면이 업데이트되었습니다. 이 탭은 이전 버전으로 실행 중입니다.
    <button class="btn small primary" type="button" onclick="location.reload()">새로고침</button>
  </div>

  <!-- 컬럼 삭제 가이드: what to edit to drop one output column (lineage.js openColumnGuide) -->
  <dialog class="guide-dialog" id="guideDialog" aria-labelledby="guideTitle">
    <div class="gd-inner">
      <div class="fd-head">
        <h2 id="guideTitle">컬럼 삭제 가이드</h2>
        <button class="fd-x" type="button" aria-label="닫기" onclick="this.closest('dialog').close()">×</button>
      </div>
      <div class="gd-body" id="guideBody"></div>
    </div>
  </dialog>

  <main id="app">
    <div class="empty-state" id="emptyState">
      Upload one or more iBATIS mapper XML files (or click "Load sample"), then "Analyze".
    </div>

    <!-- SQL Lineage Dashboard (spec section 26) -->
    <section class="screen dashboard" id="lineageScreen" hidden>
      <header class="dash-stats" id="dashStats"></header>
      <div class="dash-body">
        <aside class="dash-left" id="dashLeft">
          <div class="panel-resizer" data-side="left" role="separator" aria-orientation="vertical" aria-label="왼쪽 패널 너비" title="드래그해서 너비 조절"></div>
          <div class="view-switch" id="viewSwitch" role="tablist" aria-label="보기 전환">
            <button class="view-tab active" role="tab" id="viewTabLineage"
                    data-view="lineage" aria-selected="true" aria-controls="lineagePane">
              리니지
            </button>
            <button class="view-tab" role="tab" id="viewTabSchema"
                    data-view="schema" aria-selected="false" aria-controls="schemaPane" tabindex="-1">
              변환
            </button>
          </div>
          <div class="panel-head" id="treeHeading">XML 구조 (Tree)</div>
          <div class="dash-search">
            <input type="search" id="lineageSearch" placeholder="statement / refid / table / alias 검색" autocomplete="off">
          </div>
          <div class="panel-body" id="lineageTree" role="tree" aria-labelledby="treeHeading"></div>
          <div class="panel-head">Include 사용 현황</div>
          <div class="usage-list" id="lineageIncludeUsage"></div>
        </aside>

        <div class="dash-center">
          <div class="dash-toolbar">
            <button class="tool-btn icon panel-toggle" type="button" data-panel-toggle="left" title="왼쪽 패널 (트리) 접기/펼치기" aria-label="왼쪽 패널 접기/펼치기">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><rect x="2" y="3" width="4" height="10" rx="1" fill="currentColor" opacity=".55"/></svg>
            </button>
            <div class="breadcrumb" id="lineageBreadcrumb"></div>
            <div class="tool-btns">
              <button class="tool-btn" data-graph-action="zoom-out">−</button>
              <span class="zoom-level" id="lineageZoomLevel">100%</span>
              <button class="tool-btn" data-graph-action="zoom-in">＋</button>
              <button class="tool-btn" data-graph-action="fit">전체 보기</button>
              <span class="tool-sep" aria-hidden="true"></span>
              <span class="layout-status" id="layoutStatus" aria-live="polite"></span>
              <button class="tool-btn" data-graph-action="reset-layout" title="드래그로 옮긴 위치를 모두 되돌립니다">배치 초기화</button>
              <button class="tool-btn primary" data-graph-action="save-layout" title="옮긴 위치와 확대/이동 상태를 이 statement에 저장 (Ctrl/⌘+S)" disabled>배치 저장</button>
            </div>
            <button class="tool-btn icon panel-toggle" type="button" data-panel-toggle="right" title="오른쪽 패널 (컬럼 매핑·조인·미니맵) 접기/펼치기" aria-label="오른쪽 패널 접기/펼치기">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><rect x="10" y="3" width="4" height="10" rx="1" fill="currentColor" opacity=".55"/></svg>
            </button>
          </div>
          <div class="view-pane" id="lineagePane" role="tabpanel" aria-labelledby="viewTabLineage">
            <div class="graph-viewport" id="lineageViewport">
              <div class="graph-content" id="lineageContent">
                <svg class="graph-edges" id="lineageEdges" xmlns="http://www.w3.org/2000/svg"></svg>
                <div class="graph-nodes" id="lineageNodes"></div>
              </div>
            </div>
            <div class="dash-legend" id="lineageLegend"></div>
          </div>
          <div class="view-pane" id="schemaPane" role="tabpanel" aria-labelledby="viewTabSchema" hidden></div>
        </div>

        <aside class="dash-right" id="lineageRightPanel">
          <div class="panel-resizer" data-side="right" role="separator" aria-orientation="vertical" aria-label="오른쪽 패널 너비" title="드래그해서 너비 조절"></div>
          <div id="lineageRight"></div>
        </aside>
      </div>
    </section>

  </main>

  <!-- Schema-migration datasets: named old -> new mapping definitions, edited as JSON -->
  <section class="screen ds-screen" id="datasetScreen" role="tabpanel" aria-labelledby="screenTabDatasets" hidden>
    <aside class="ds-list">
      <div class="ds-list-head">
        <span>데이터셋</span>
        <button class="btn primary small" id="dsNewBtn" type="button">＋ 새 데이터셋</button>
      </div>
      <div class="ds-items" id="dsItems"></div>
      <div class="ds-list-foot">
        <button class="btn small" id="dsSampleBtn" type="button">샘플 데이터셋 불러오기</button>
        <button class="btn small" id="dsAdvancedBtn" type="button">advanced 샘플 데이터셋 불러오기</button>
        <label class="btn small">
          JSON 파일 가져오기
          <input type="file" id="dsImportInput" accept=".json,application/json" hidden>
        </label>
      </div>
    </aside>
    <div class="ds-main" id="dsMain"></div>
  </section>

  <script src="app.js"></script>
  <script src="lineage.js"></script>
  <script src="schema.js"></script>
  <script src="datasets.js"></script>
</body>
</html>
